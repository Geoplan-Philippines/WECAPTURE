<main class="w-screen h-screen flex justify-center items-center" #main_wrapper_ref>
  @if(isCameraOn){
    <div class="flex items-start justify-between w-full h-full space-x-5">
      <div class="bg-white shadow-lg rounded-lg w-[20rem] p-5 m-5 flex flex-col space-y-5 items-center justify-center">
        <span class="text-center text-xl">Photos Taken</span>
        <span class="text-center text-6xl ">{{number_of_photos_taken}}/{{selected_pose}}</span>
      </div>
      <div class="relative shadow-lg">
       <video class="w-auto h-screen object-cover object-center -scale-x-100 relative" autoplay muted #camera_ref></video>
        <div [ngClass]="{'bg-black': activate_shutter }" class="absolute top-0 w-full h-full flex rounded-md justify-center items-end">
          <span [ngClass]="{'timer-label': show_timer_label}" class="text-3xl 2xl:text-5xl text-white w-full flex justify-center items-center bg-[#ffffff3d] h-[0px]">{{timer_label}}</span>
        </div>
      </div>
      <div class="bg-white shadow-lg rounded-lg w-[20rem] p-5 m-5 flex items-center justify-center">
        <span class="text-center">Step into the photo booth, choose your pose, get ready for the countdown, and smile when the camera clicks!</span>
      </div>
    </div>
  }

  <div [ngClass]="{'hidden': isCameraOn}" class="w-full h-full flex justify-center items-center">
    <div class="flex justify-center items-center w-full">
      <div class="overflow-hidden rounded-lg bg-white shadow-md scale-[0.7] 2xl:scale-95">
        <canvas class="fadeDown p-5 " width="410" height="630" #canvas_ref></canvas>
      </div>
    </div>
    <div class="flex flex-col items-center justify-center space-y-8 w-full">
      <div>
        <img class="w-sm h-sm 2xl:w-xl 2xl:h-xl" src="../assets/Asset_1.svg" alt="">
      </div>
      <div>
        <div class="bg-white p-3 rounded-lg">
          <img class="w-3xs h-3xs 2xl:w-sm 2xl:h-sm" src="../assets/qr code.png" alt="">
        </div>
      </div>
      <span class="text-xl 2xl:text-3xl">Get the soft copy, scan me!</span>
    </div>
  </div>
</main>
